name: frontend-checks

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"

concurrency:
  # head_ref (PR events) and ref_name (push events) both resolve to the bare
  # branch name, so a push and a pull_request for the same branch share one
  # group. github.ref would not: it's "refs/heads/<branch>" on push, which
  # never matches head_ref's "<branch>".
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
