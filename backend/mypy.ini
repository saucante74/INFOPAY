# Type-checking config. Run with:  mypy --strict app/
# (installed via requirements-dev.txt, not shipped in the Docker image)
[mypy]
python_version = 3.12
plugins = pydantic.mypy

# Pydantic v2 declares several settings fields as `Field(None, alias="...")`.
# Without this plugin mypy synthesises __init__ from the aliases and treats
# those defaulted fields as required — e.g. ChatAnthropic(timeout=..., stop=...).
