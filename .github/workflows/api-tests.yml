name: api-tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/api-tests.yml"

concurrency:
  # head_ref (PR events) and ref_name (push events) both resolve to the bare
  # branch name, so a push and a pull_request for the same branch share one
  # group. github.ref would not: it's "refs/heads/<branch>" on push, which
  # never matches head_ref's "<branch>".
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest (with coverage)
        run: pytest --cov=app --cov-report=term-missing
